<!DOCTYPE html>

    <style>
        :root { --gold: #d4af37; --bg: #1a1a1a; --text: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; }
        header { text-align: center; padding: 20px; background: #000; border-bottom: 2px solid var(--gold); }
        .logo { max-width: 120px; height: auto; border-radius: 50%; border: 2px solid var(--gold); margin-bottom: 10px; }
        .contact-bar { display: flex; justify-content: space-around; flex-wrap: wrap; background: #333; padding: 10px; position: sticky; top: 0; z-index: 100; }
        .contact-btn { color: var(--gold); text-decoration: none; font-size: 14px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; padding: 15px; }
        .card { background: #2a2a2a; border-radius: 10px; padding: 10px; text-align: center; border: 1px solid #444; }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
        .price { color: var(--gold); font-size: 18px; font-weight: bold; margin: 5px 0; }
        .note { font-size: 10px; color: #aaa; margin-bottom: 5px; }
        .btn-buy { background: var(--gold); color: #000; border: none; padding: 8px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
