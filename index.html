<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر ذا سموكر</title>
    <style>
        :root { --gold: #d4af37; --bg: #121212; --card-bg: #1e1e1e; --text: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; scroll-behavior: smooth; }
        
        header { text-align: center; padding: 25px 15px; background: linear-gradient(180deg, #000000 0%, #121212 100%); border-bottom: 2px solid var(--gold); }
        .logo { width: 130px; height: 130px; border-radius: 50%; border: 3px solid var(--gold); box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); object-fit: cover; margin-bottom: 10px; }
        
        /* شريط التواصل المباشر - أزرار كبيرة بارزة */
        .contact-bar { display: flex; flex-direction: column; gap: 10px; padding: 15px; max-width: 500px; margin: 0 auto; }
        .contact-btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: #252525; color: var(--gold); border: 2px solid var(--gold); padding: 12px 20px; border-radius: 25px; text-decoration: none; font-size: 16px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: 0.3s; }
        .contact-btn:active { transform: scale(0.98); background: var(--gold); color: #000; }
        
        /* شريط البحث والفئات */
        .controls { padding: 15px; max-width: 600px; margin: 0 auto; text-align: center; }
        .search-input { width: 90%; padding: 12px; border-radius: 20px; border: 1px solid var(--gold); background: #1a1a1a; color: #fff; text-align: center; font-size: 15px; margin-bottom: 15px; outline: none; }
        .categories { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .cat-btn { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 8px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: 0.3s; }
        .cat-btn.active, .cat-btn:hover { background: var(--gold); color: #000; border-color: var(--gold); font-weight: bold; }

        /* شبكة المنتجات - تصميم متكور */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; padding: 15px; max-width: 1000px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: 18px; padding: 12px; text-align: center; border: 1px solid #333; box-shadow: 0 6px 12px rgba(0,0,0,0.4); display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 160px; object-fit: cover; border-radius: 14px; margin-bottom: 8px; }
        .card h3 { font-size: 15px; margin: 5px 0; color: #fff; }
        .price { color: var(--gold); font-size: 16px; font-weight: bold; margin: 4px 0; }
        .note { font-size: 11px; color: #aaa; margin-bottom: 8px; }
        .btn-buy { background: var(--gold); color: #000; border: none; padding: 10px; width: 100%; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 13px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .btn-buy:active { opacity: 0.8; }
    </style>
</head>
<body>

<header>
    <img src="logo.jpg" alt="لوكو متجر ذا سموكر" class="logo">
    <h1>متجر ذا سموكر 💨</h1>
</header>

<!-- شريط التواصل المباشر الأزرار الكبيرة -->
<div class="contact-bar">
    <a href="https://wa.me/9647760115333" class="contact-btn">💬 تواصل عبر الواتساب</a>
    <a href="tel:+9647760115333" class="contact-btn">📞 اتصال مباشر</a>
    <a href="https://www.instagram.com/arakel_the_smoker?igsh=MXZpcTFleHZlcHNuYw==" class="contact-btn">📸 تابعنا على الانستغرام</a>
    <a href="https://www.facebook.com/share/1CnFTDmoaQ/?mibextid=wwXIfr" class="contact-btn">📘 تابعنا على الفيسبوك</a>
    <a href="https://maps.app.goo.gl/1uj2kJSokqWUa4bn9" class="contact-btn">📍 موقع المحل على الخريطة</a>
    <a href="#menu-section" class="contact-btn" style="background: var(--gold); color: #000;">📜 منتجاتنا (المنيو)</a>
</div>

<!-- شريط البحث والفئات -->
<div class="controls" id="menu-section">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث عن مادة..." onkeyup="filterProducts()">
    <div class="categories">
        <button class="cat-btn active" onclick="filterCategory('الكل', this)">الكل</button>
        <button class="cat-btn" onclick="filterCategory('أراجيل', this)">أراجيل</button>
        <button class="cat-btn" onclick="filterCategory('سحبات', this)">سحبات</button>
        <button class="cat-btn" onclick="filterCategory('بكار', this)">بكار</button>
        <button class="cat-btn" onclick="filterCategory('معسل', this)">معسل</button>
        <button class="cat-btn" onclick="filterCategory('فناجين وألعاب', this)">فناجين وألعاب</button>
    </div>
</div>

<div class="grid" id="productGrid">
    <!-- المنتجات تنعرض هنا -->
</div>

<script>
    const products = [
        { name: "اركيلة الماني صغير", price: "35,000", img: "item1.jpg", cat: "أراجيل" },
        { name: "اركيلة الماني كبير", price: "50,000", img: "item2.jpg", cat: "أراجيل" },
        { name: "سحبة سلطان", price: "15,000", img: "item3.jpg", cat: "سحبات" },
        { name: "سحبة اوك", price: "13,000", img: "item4.jpg", cat: "سحبات" },
        { name: "سحبة اوكسبار", price: "17,000", img: "item5.jpg", cat: "سحبات" },
        { name: "سحبة فوزول", price: "15,000", img: "item6.jpg", cat: "سحبات" },
        { name: "سحبة EZY", price: "7,000", img: "item7.jpg", cat: "سحبات" },
        { name: "سحبة KUZ", price: "8,000", img: "item8.jpg", cat: "سحبات" },
        { name: "سحبة TRUE STORE", price: "8,000", img: "item9.jpg", cat: "سحبات" },
        { name: "سحبة ال فارز", price: "5,000", img: "item10.jpg", cat: "سحبات" },
        { name: "بكار صاج 30cm", price: "8,000", img: "item11.jpg", cat: "بكار" },
        { name: "بكار صاج صغير", price: "5,000", img: "item12.jpg", cat: "بكار" },
        { name: "بكار صاج 40cm", price: "12,000", img: "item13.jpg", cat: "بكار" },
        { name: "بكار جوز 30cm", price: "5,000", img: "item14.jpg", cat: "بكار" },
        { name: "بكار جوز صغير", price: "2,000", img: "item15.jpg", cat: "بكار" },
        { name: "بكار جاو الاصلي", price: "15,000", img: "item16.jpg", cat: "بكار" },
        { name: "بكار جوز 50cm", price: "12,000", img: "item17.jpg", cat: "بكار" },
        { name: "فاخر (تفاحتين/نعناع/علج)", price: "1,500", img: "item18.jpg", cat: "معسل" },
        { name: "النخله (تفاحتين)", price: "2,000", img: "item19.jpg", cat: "معسل" },
        { name: "مزاج (نعناع/علج ونعناع)", price: "1,250", img: "item20.jpg", cat: "معسل" },
        { name: "العراب (علج ونعناع/نعناع)", price: "1,250", img: "item21.jpg", cat: "معسل" },
        { name: "اداليا (نعناع/انكليزي)", price: "1,250", img: "item22.jpg", cat: "معسل" },
        { name: "زين (نعناع)", price: "1,250", img: "item23.jpg", cat: "معسل" },
        { name: "شربتلي (نعناع/علج ونعناع)", price: "1,250", img: "item24.jpg", cat: "معسل" },
        { name: "جي بي ار (نعناع)", price: "1,250", img: "item25.jpg", cat: "معسل" },
        { name: "مزايا (انكليزي/ليمون/تفاحتين)", price: "1,250", img: "item26.jpg", cat: "معسل" },
        { name: "فنجان بصمه سيراميك", price: "5,000", img: "item27.jpg", cat: "فناجين وألعاب", note: "تتوفر أشكال أخرى" },
        { name: "فنجان 5 زروف", price: "2,000", img: "item28.jpg", cat: "فناجين وألعاب" },
        { name: "فنجان بصمه", price: "2,000", img: "item29.jpg", cat: "فناجين وألعاب" },
        { name: "دومينو", price: "4,000", img: "item30.jpg", cat: "فناجين وألعاب" }
    ];

    let currentCat = "الكل";

    function renderProducts(items) {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = "";
        if(items.length === 0) {
            grid.innerHTML = "<p style='grid-column: 1/-1; color: #888;'>لا توجد مواد مطابقة للبحث</p>";
            return;
        }
        items.forEach(p => {
            grid.innerHTML += `
                <div class="card">
                    <div>
                        <img src="${p.img}" alt="${p.name}">
                        <h3>${p.name}</h3>
                        ${p.note ? `<div class="note">${p.note}</div>` : ''}
                    </div>
                    <div>
                        <div class="price">${p.price} د.ع</div>
                        <button class="btn-buy" onclick="window.open('https://wa.me/9647760115333?text=اريد اطلب ${p.name}')">طلب عبر الواتساب</button>
                    </div>
                </div>
            `;
        });
    }

    function filterCategory(cat, btn) {
        currentCat = cat;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterProducts();
    }

    function filterProducts() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = products.filter(p => {
            const matchesCat = (currentCat === "الكل" || p.cat === currentCat);
            const matchesQuery = p.name.toLowerCase().includes(query);
            return matchesCat && matchesQuery;
        });
        renderProducts(filtered);
    }

    // عرض الكل عند التحميل
    renderProducts(products);
</script>

</body>
</html>
