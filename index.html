<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اراكيل ذي سموكر | Smoker Shisha</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #1a1d24;
            --accent-color: #ffb703;
            --text-color: #ffffff;
            --text-secondary: #a0a5b1;
            --green-whatsapp: #25d366;
            --blue-call: #007bff;
            --insta-color: #e1306c;
            --fb-color: #1877f2;
            --maps-color: #ea4335;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .profile-card {
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 24px;
            border: 1px solid rgba(255, 183, 3, 0.25);
            box-shadow: 0 12px 35px rgba(0,0,0,0.6);
        }

        .logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid var(--accent-color);
            object-fit: cover;
            margin-bottom: 15px;
            box-shadow: 0 0 25px rgba(255, 183, 3, 0.35);
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            color: var(--accent-color);
            margin-bottom: 6px;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            text-decoration: none;
            color: #fff;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-whatsapp { background-color: var(--green-whatsapp); }
        .btn-call { background-color: var(--blue-call); }
        .btn-insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .btn-facebook { background-color: var(--fb-color); }
        .btn-maps { background-color: var(--maps-color); }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-card">
            <!-- صورة اللوكو -->
            <img src="logo.jpg" alt="Smoker Logo" class="logo">
            
            <h1>اراكيل ذي سموكر 💨</h1>
            <p class="subtitle">أرقى أنواع الأراكيل والنكهات المتميزة - خدمة توصيل سريعة 🛵</p>
            
            <!-- أزرار التواصل والتطبيقات -->
            <div class="links-container">
                
                <a href="https://wa.me/9647760115333" class="btn btn-whatsapp" target="_blank">
                    💬 تواصل عبر الواتساب
                </a>

                <a href="tel:07760115333" class="btn btn-call">
                    📞 اتصال مباشر
                </a>

                <a href="https://www.instagram.com/arakel_the_smoker?igsh=MXZpcTFleHZlcHNuYw==" class="btn btn-insta" target="_blank">
                    📸 تابعنا على إنستغرام
                </a>

                <a href="https://www.facebook.com/share/1CnFTDmoaQ/?mibextid=wwXIfr" class="btn btn-facebook" target="_blank">
                    📘 تابعنا على فيسبوك
                </a>

                <a href="https://maps.app.goo.gl/zHz3PnxA9DG2HXSq5" class="btn btn-maps" target="_blank">
                    📍 موقع المحل على الخريطة
                </a>

            </div>

            <div class="footer">
                <p>© 2026 اراكيل ذي سموكر - جميع الحقوق محفوظة</p>
            </div>
        </div>
    </div>

</body>
</html>
