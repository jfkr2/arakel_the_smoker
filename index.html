<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Smoker | المتجر العصري</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --bg: #0a0a0a; --glass: rgba(255, 255, 255, 0.05); }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: #fff; margin: 0; padding: 0; background-image: radial-gradient(circle at top, #1a1a1a, #0a0a0a); min-height: 100vh; }
        
        header { text-align: center; padding: 40px 20px; }
        .logo { width: 140px; height: 140px; border-radius: 30px; border: 2px solid var(--gold); box-shadow: 0 0 30px rgba(212, 175, 55, 0.3); transition: transform 0.3s; }
        .logo:hover { transform: scale(1.05); }
        h1 { margin-top: 15px; font-size: 28px; letter-spacing: 2px; color: var(--gold); }

        /* شريط التواصل - تصميم زجاجي */
        .contact-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; max-width: 600px; margin: 0 auto; }
        .contact-btn { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px; border-radius: 15px; text-decoration: none; color: #fff; text-align: center; font-size: 13px; transition: 0.4s; }
        .contact-btn:hover { border-color: var(--gold); background: rgba(212, 175, 55, 0.1); }
        .full-width { grid-column: span 2; font-weight: bold; color: var(--gold); }

        /* الفلاتر والبحث */
        .controls { padding: 20px; text-align: center; position: sticky; top: 0; z-index: 100; background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(15px); }
        .search-input { width: 80%; padding: 12px; border-radius: 25px; border: 1px solid #333; background: #1a1a1a; color: #fff; text-align: center; }
        .categories { display: flex; justify-content: center; gap: 10px; margin-top: 15px; overflow-x: auto; padding-bottom: 5px; }
        .cat-btn { background: #222; border: none; padding: 8px 18px; border-radius: 20px; color: #aaa; cursor: pointer; white-space: nowrap; transition: 0.3s; }
        .cat-btn.active { background: var(--gold); color: #000; font-weight: bold; }

        /* الكروت - تصميم متطور */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; padding: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: var(--glass); backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.05); border-radius: 25px; padding: 15px; transition: 0.3s; }
        .card:hover { transform: translateY(-10px); border-color: var(--gold); }
        .card img { width: 100%; height: 140px; object-fit: cover; border-radius: 20px; }
        .price { color: var(--gold); font-size: 18px; font-weight: bold; margin: 10px 0; }
        .btn-buy { background: linear-gradient(45deg, #d4af37, #aa8c2c); border: none; padding: 10px; width: 100%; border-radius: 12px; color: #000; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <img src="logo.jpg" alt="Logo" class="logo">
    <h1>THE SMOKER 💨</h1>
</header>

<div class="contact-bar" id="contact">
    <a href="https://wa.me/9647760115333" class="contact-btn">💬 واتساب</a>
    <a href="tel:+9647760115333" class="contact-btn">📞 اتصال</a>
    <a href="https://www.instagram.com/arakel_the_smoker" class="contact-btn">📸 انستغرام</a>
    <a href="https://www.facebook.com/share/1CnFTDmoaQ/" class="contact-btn">📘 فيسبوك</a>
    <a href="https://maps.app.goo.gl/1uj2kJSokqWUa4bn9" class="contact-btn full-width">📍 موقعنا على الخريطة</a>
</div>

<div class="controls">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث عن طلبك هنا..." onkeyup="filterProducts()">
    <div class="categories">
        <button class="cat-btn active" onclick="filterCategory('الكل', this)">الكل</button>
        <button class="cat-btn" onclick="filterCategory('أراجيل', this)">أراجيل</button>
        <button class="cat-btn" onclick="filterCategory('سحبات', this)">سحبات</button>
        <button class="cat-btn" onclick="filterCategory('بكار', this)">بكار</button>
        <button class="cat-btn" onclick="filterCategory('معسل', this)">معسل</button>
        <button class="cat-btn" onclick="filterCategory('فناجين وألعاب', this)">فناجين</button>
    </div>
</div>

<div class="grid" id="productGrid"></div>

<script>
    const products = [
        { name: "اركيلة الماني صغير", price: "35,000", img: "item1.jpg", cat: "أراجيل" },
        { name: "اركيلة الماني كبير", price: "50,000", img: "item2.jpg", cat: "أراجيل" },
        { name: "سحبة سلطان", price: "15,000", img: "item3.jpg", cat: "سحبات" },
        { name: "سحبة اوك", price: "13,000", img: "item4.jpg", cat: "سحبات" },
        { name: "سحبة اوكسبار", price: "17,000", img: "item5.jpg", cat: "سحبات" },
        { name: "سحبة فوزول", price: "15,000", img: "item6.jpg", cat: "سحبات" },
        { name: "سحبة EZY", price: "7,000", img: "item7.jpg", cat: "سحبات" },
        { name: "سحبة KUZ", price: "8,000", img: "item8.jpg", cat: "سحبات" },
        { name: "سحبة TRUE STORE", price: "8,000", img: "item9.jpg", cat: "سحبات" },
        { name: "سحبة ال فارز", price: "5,000", img: "item10.jpg", cat: "سحبات" },
        { name: "بكار صاج 30cm", price: "8,000", img: "item11.jpg", cat: "بكار" },
        { name: "بكار صاج صغير", price: "5,000", img: "item12.jpg", cat: "بكار" },
        { name: "بكار صاج 40cm", price: "12,000", img: "item13.jpg", cat: "بكار" },
        { name: "بكار جوز 30cm", price: "5,000", img: "item14.jpg", cat: "بكار" },
        { name: "بكار جوز صغير", price: "2,000", img: "item15.jpg", cat: "بكار" },
        { name: "بكار جاو الاصلي", price: "15,000", img: "item16.jpg", cat: "بكار" },
        { name: "بكار جوز 50cm", price: "12,000", img: "item17.jpg", cat: "بكار" },
        { name: "فاخر (تفاحتين/نعناع/علج)", price: "1,500", img: "item18.jpg", cat: "معسل" },
        { name: "النخله (تفاحتين)", price: "2,000", img: "item19.jpg", cat: "معسل" },
        { name: "مزاج (نعناع/علج ونعناع)", price: "1,250", img: "item20.jpg", cat: "معسل" },
        { name: "العراب (علج ونعناع/نعناع)", price: "1,250", img: "item21.jpg", cat: "معسل" },
        { name: "اداليا (نعناع/انكليزي)", price: "1,250", img: "item22.jpg", cat: "معسل" },
        { name: "زين (نعناع)", price: "1,250", img: "item23.jpg", cat: "معسل" },
        { name: "شربتلي (نعناع/علج ونعناع)", price: "1,250", img: "item24.jpg", cat: "معسل" },
        { name: "جي بي ار (نعناع)", price: "1,250", img: "item25.jpg", cat: "معسل" },
        { name: "مزايا (انكليزي/ليمون/تفاحتين)", price: "1,250", img: "item26.jpg", cat: "معسل" },
        { name: "فنجان بصمه سيراميك", price: "5,000", img: "item27.jpg", cat: "فناجين وألعاب" },
        { name: "فنجان 5 زروف", price: "2,000", img: "item28.jpg", cat: "فناجين وألعاب" },
        { name: "فنجان بصمه", price: "2,000", img: "item29.jpg", cat: "فناجين وألعاب" },
        { name: "دومينو", price: "4,000", img: "item30.jpg", cat: "فناجين وألعاب" }
    ];

    let currentCat = "الكل";

    function renderProducts(items) {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = "";
        items.forEach(p => {
            grid.innerHTML += `
                <div class="card">
                    <img src="${p.img}" alt="${p.name}">
                    <h3 style="margin-top:10px">${p.name}</h3>
                    <div class="price">${p.price} د.ع</div>
                    <button class="btn-buy" onclick="window.open('https://wa.me/9647760115333?text=اريد اطلب ${p.name}')">طلب الآن</button>
                </div>
            `;
        });
    }

    function filterCategory(cat, btn) {
        currentCat = cat;
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterProducts();
    }

    function filterProducts() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = products.filter(p => {
            const matchesCat = (currentCat === "الكل" || p.cat === currentCat);
            const matchesQuery = p.name.toLowerCase().includes(query);
            return matchesCat && matchesQuery;
        });
        renderProducts(filtered);
    }
    renderProducts(products);
</script>
</body>
</html>
